services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hoppscotch}
    volumes:
      - ../volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ── DB Migration (runs once on deploy) ───────────────────────────────────
  migrate:
    image: hoppscotch/hoppscotch:password
    env_file:
      - ../.env
    command: sh -c "pnpm exec prisma migrate deploy"
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  # ── Hoppscotch AIO ───────────────────────────────────────────────────────
  hoppscotch:
    image: hoppscotch/hoppscotch:password
    env_file:
      - ../.env
      - ../.env.urls
    volumes:
      - ../volumes/hoppscotch:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ── Nginx (internal reverse proxy, port 3300) ─────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - target: 80
        published: 3300
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ── Mailcatcher ───────────────────────────────────────────────────────────
  mailcatcher:
    image: dockage/mailcatcher:0.9.0
    volumes:
      - ../volumes/mailcatcher:/root/.mailcatcher
    ports:
      - target: 1080
        published: 1080
        mode: host
      - target: 1025
        published: 1025
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
