# Hoppscotch — Swarm ichidagi nginx (published odatda :3300)
# Hech qanday host/IP cheklovi yo'q (listen 80, server_name _).
# Tashqi gateway X-Forwarded-Host / Proto / Port uzatsa, backend redirect va cookie konteksti to'g'ri bo'ladi.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $host $backend_upstream {
        default "http://hoppscotch:80";
    }

    map $host $auth_upstream {
        default "http://auth-service:8000";
    }

    map $host $mailcatcher_upstream {
        default "http://mailcatcher:1080";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_host $effective_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    map $http_x_forwarded_proto $effective_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_x_forwarded_port $effective_port {
        default $http_x_forwarded_port;
        ''      $server_port;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 500M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / {
            return 302 /api-docs/;
        }

        location ^~ /api-docs/mailcatcher/ {
            auth_basic "MailCatcher";
            auth_basic_user_file /etc/nginx/.htpasswd;

            rewrite ^/api-docs/mailcatcher/(.*)$ /$1 break;
            proxy_pass $mailcatcher_upstream;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
            sub_filter '<base href="/">' '<base href="/api-docs/mailcatcher/">';
            sub_filter 'href="/'   'href="/api-docs/mailcatcher/';
            sub_filter 'src="/'    'src="/api-docs/mailcatcher/';
            sub_filter 'action="/' 'action="/api-docs/mailcatcher/';
        }

        location = /api-docs {
            return 302 /api-docs/;
        }

        location ^~ /api-docs/password-auth {
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
        }

        location ^~ /api-docs/admin {
            rewrite ^/api-docs/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_redirect off;
            proxy_cookie_path /admin/ /api-docs/admin/;
            proxy_cookie_path / /api-docs/;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
            sub_filter '<head>' '<head><base href="/api-docs/admin/">';
            sub_filter '="/admin/assets/'  '="/api-docs/admin/assets/';
            sub_filter 'href="/admin/assets/' 'href="/api-docs/admin/assets/';
        }

        location ^~ /api-docs/ {
            rewrite ^/api-docs/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_redirect ~^/(.+)$ /api-docs/$1;
            proxy_cookie_path / /api-docs/;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
            sub_filter '<head>' '<head><base href="/api-docs/">';
            sub_filter '="/assets/'    '="/api-docs/assets/';
            sub_filter 'url(/assets/'  'url(/api-docs/assets/';
            sub_filter '"/assets/'     '"/api-docs/assets/';
            sub_filter "'/assets/"     "'/api-docs/assets/";
            sub_filter '`/assets/'     '`/api-docs/assets/';
            sub_filter '(/assets/'     '(/api-docs/assets/';
            sub_filter '"assets/'      '"/api-docs/assets/';
            sub_filter "'assets/"      "'/api-docs/assets/";
            sub_filter '`assets/'      '`/api-docs/assets/';
            sub_filter '="/images/'    '="/api-docs/images/';
            sub_filter 'url(/images/'  'url(/api-docs/images/';
            sub_filter '"/images/'     '"/api-docs/images/';
            sub_filter "'/images/"     "'/api-docs/images/";
            sub_filter '`/images/'     '`/api-docs/images/';
            sub_filter '(/images/'     '(/api-docs/images/';
            sub_filter '"images/'      '"/api-docs/images/';
            sub_filter "'images/"      "'/api-docs/images/";
            sub_filter '`images/'      '`/api-docs/images/';
            sub_filter '(/images/'     '(/api-docs/images/';
        }

        location / {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /admin {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /backend/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location /proxy/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
