# Hoppscotch — Swarm ichidagi nginx (published odatda :3300)
# Hech qanday host/IP cheklovi yo'q (listen 80, server_name _).
# Tashqi gateway X-Forwarded-Host / Proto / Port uzatsa, backend redirect va cookie konteksti to'g'ri bo'ladi.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $host $backend_upstream {
        default "http://hoppscotch:80";
    }

    map $host $mailcatcher_upstream {
        default "http://mailcatcher:1080";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_host $effective_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    map $http_x_forwarded_proto $effective_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_x_forwarded_port $effective_port {
        default $http_x_forwarded_port;
        ''      $server_port;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 500M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / {
            return 302 /hoppscotch/;
        }

        location = /mailcatcher {
            return 302 /mailcatcher/;
        }

        location ^~ /mailcatcher/ {
            proxy_pass $mailcatcher_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            sub_filter_once off;
            sub_filter_types text/css application/javascript application/json;
            sub_filter '<base href="/">' '<base href="/mailcatcher/">';
            sub_filter 'href="/' 'href="/mailcatcher/';
            sub_filter 'src="/' 'src="/mailcatcher/';
            sub_filter 'action="/' 'action="/mailcatcher/';
        }

        location = /hoppscotch {
            return 302 /hoppscotch/;
        }

        location ^~ /hoppscotch/ {
            rewrite ^/hoppscotch/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
            sub_filter '<head>' '<head><base href="/hoppscotch/">';
            sub_filter '="/_nuxt/'   '="/hoppscotch/_nuxt/';
            sub_filter '="/assets/'  '="/hoppscotch/assets/';
            sub_filter 'url(/_nuxt/' 'url(/hoppscotch/_nuxt/';
            sub_filter 'url(/assets/' 'url(/hoppscotch/assets/';
            sub_filter '"/_nuxt/'   '"/hoppscotch/_nuxt/';
            sub_filter '"/assets/'  '"/hoppscotch/assets/';
        }

        location / {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /admin {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /backend/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location /proxy/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $effective_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $effective_proto;
            proxy_set_header X-Forwarded-Host $effective_host;
            proxy_set_header X-Forwarded-Port $effective_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
