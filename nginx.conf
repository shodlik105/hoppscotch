# Hoppscotch — Nginx reverse proxy
# Subpath: / (app), /admin, /backend (GraphQL, REST, WebSocket)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker DNS — container recreate/restart'da IP o'zgarsa nginx yangi IP ni topadi
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Variable — har so'rovda resolve (container restart'da 502 oldini olish)
    map $host $backend_upstream {
        default "http://hoppscotch:80";
    }

    # Timeouts for WebSocket / GraphQL subscriptions
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;

        client_max_body_size 500M;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Main app (/)
        location / {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Admin dashboard (/admin)
        location /admin {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend — GraphQL + REST + WebSocket
        location /backend/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (GraphQL subscriptions)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
